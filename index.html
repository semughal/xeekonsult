<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XEE KONSULT AB | IT, ekonomi & digital utveckling</title>
  <img src="/images/xee_logo_homepage.png" alt="XEE Konsult" style="height:48px;width:auto">
</head>
<body>
  <script>
    Promise.all([
      fetch("https://raw.githubusercontent.com/semughal/xeekonsult/ee50b0a44ec7adb36eaa506450f5e9a9b609226f/index.html").then(r => {
        if (!r.ok) throw new Error("Kunde inte läsa originalinnehållet");
        return r.text();
      }),
      fetch("https://raw.githubusercontent.com/semughal/xeekonsult/master/customer-logos.html").then(r => {
        if (!r.ok) throw new Error("Kunde inte läsa kundsektionen");
        return r.text();
      })
    ]).then(([original, customers]) => {
      const insertionPoint = original.lastIndexOf("</main>");
      if (insertionPoint === -1) {
        throw new Error("Kunde inte hitta huvudinnehållet");
      }
      const combined = original.slice(0, insertionPoint) + "\n" + customers + "\n" + original.slice(insertionPoint);
      document.open();
      document.write(combined);
      document.close();
    }).catch(error => {
      document.body.innerHTML = "<p style='font-family:sans-serif;padding:2rem'>" + error.message + "</p>";
    });
  </script>
</body>
</html>
